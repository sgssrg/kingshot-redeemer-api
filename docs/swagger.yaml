basePath: /
definitions:
  model.CustomScrapePlayerErrInfo:
    properties:
      message:
        type: string
      pid:
        type: integer
      type:
        type: integer
    type: object
  model.DeletePlayerErrorResponse:
    properties:
      deleted:
        type: boolean
      error:
        type: string
      pid:
        type: string
    type: object
  model.DeletePlayerResponse:
    properties:
      deleted:
        type: boolean
      pid:
        type: string
    type: object
  model.PlayerAPIResponse:
    properties:
      message:
        type: string
      player:
        $ref: '#/definitions/model.PlayerInfo'
      type:
        type: integer
    type: object
  model.PlayerInfo:
    properties:
      alliance:
        type: string
      dName:
        type: string
      kid:
        type: integer
      pfp:
        type: string
      pid:
        type: integer
    type: object
  model.PlayerReqBody:
    properties:
      alliance:
        type: string
      kid:
        minimum: 1
        type: integer
      pid:
        type: string
    required:
    - kid
    - pid
    type: object
  model.ScrapePlayerInfo:
    properties:
      alliance:
        type: string
      dName:
        type: string
      kid:
        type: integer
      pfp:
        type: string
      pid:
        type: integer
    type: object
host: localhost:8081
info:
  contact: {}
  description: API for redeeming KingShot gift codes on behalf of registered players.
    OpenAPI spec served at /api/openapi.json for import into GitBook.
  title: Kingshot Redeem API
  version: "1.0"
paths:
  /:
    get:
      description: Returns "Hello, World!" to confirm the service is running.
      produces:
      - text/plain
      responses:
        "200":
          description: Hello, World!
          schema:
            type: string
      summary: Health check
      tags:
      - System
  /player/add:
    post:
      consumes:
      - application/json
      description: Adds a new player to the database. When KSFetchAvailable is enabled,
        profile data is fetched from the KingShot API; otherwise only the provided
        fields are stored.
      parameters:
      - description: Player to add
        in: body
        name: player
        required: true
        schema:
          $ref: '#/definitions/model.PlayerReqBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created Player examples" examples(
          schema:
            $ref: '#/definitions/model.PlayerAPIResponse'
        "400":
          description: Invalid JSON or validation error
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Unable to add the player
          schema:
            additionalProperties: true
            type: object
      summary: Add a player
      tags:
      - Player
  /player/del/{pid}:
    delete:
      description: Removes a player from the database by player ID.
      parameters:
      - description: Player ID
        in: path
        name: pid
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Player deleted" example({"pid":123,"deleted":true})
          schema:
            $ref: '#/definitions/model.DeletePlayerResponse'
        "500":
          description: Delete failed" example({"pid":123,"deleted":false,"error":"database
            error"})
          schema:
            $ref: '#/definitions/model.DeletePlayerErrorResponse'
      summary: Delete a player
      tags:
      - Player
  /player/update:
    patch:
      description: 'Loads all players from the database and update every single of
        them, streaming per-player results as Server-Sent Events (event: update-res)
        followed by a summary (event: update-fin) about the rows it replaced with
        recent information. Rate limited.'
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'update-res and update-fin event" example(event: update-res\ndata:
            {"updated":true,"player":{"pid":123,"kid":789,"dNname":"updated-player-name","pfp":"<updated-player-pfp-url>,"alliance":"DES"}}\n\n
            event: update-fin\ndata: {"count":123 })'
          schema:
            type: string
      summary: Updates the Db with latest Player
      tags:
      - Player
  /redeem/db:
    post:
      description: 'Loads all players from the database and redeems the configured
        gift code for each one, streaming per-player results as Server-Sent Events
        (event: redeem-res) followed by a summary (event: redeem-fin). Rate limited.'
      parameters:
      - description: Gift code
        example: KS0803
        in: query
        name: code
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: 'redeem-res and redeem-fin event" example(event: redeem-res\ndata:
            {"fid":"123","code":"KS0803","result":{"errCode":20000,"msg":"Redeemed"},"success":true,"time":"2026-08-07T22:05:40+05:30"}\n\n
            event: redeem-fin\ndata: {"redeemed":10,"manual":2,"playerDead":1,"codeExpired":3})'
          schema:
            type: string
      summary: Redeem gift code for all players
      tags:
      - Redeem
  /redeem/ws:
    get:
      description: Upgrades the connection to a WebSocket and greets the client.
      responses:
        "101":
          description: Switching Protocols
      summary: WebSocket test
      tags:
      - Redeem
  /scraper/stratforge/{fid}:
    get:
      consumes:
      - application/json
      description: Fetches player profile data from stratforge.tools by player FID
        (Fleet ID). Returns player display name, kingdom ID, alliance, and profile
        picture.
      parameters:
      - description: Player Fleet ID
        in: path
        name: fid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/model.ScrapePlayerInfo'
        "409":
          description: Player ID doesn't exist
          schema:
            $ref: '#/definitions/model.CustomScrapePlayerErrInfo'
        "500":
          description: Scraping failed or invalid Player ID
          schema:
            $ref: '#/definitions/model.CustomScrapePlayerErrInfo'
        "502":
          description: Failed to fetch from stratforge.tools
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Scrape player profile from StratForge
      tags:
      - Scraper
swagger: "2.0"
